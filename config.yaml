project_name: convnext_ensemble_classifier
seed: 42
device: auto
num_classes: 4
image_size: 224
batch_size: 32
num_workers: 2
train_dir: data/train
val_dir: data/val
test_dir: data/test
save_dir: checkpoints
log_dir: logs
tensorboard_dir: runs/convnext_ensemble_classifier
model:
  name: convnext_ensemble
  ensemble_models:
    - convnext_tiny
    - convnext_small
    - convnext_base
  pretrained: false
  dropout: 0.2
  enable_gradcam: true
optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.0001
  momentum: 0.9
scheduler:
  name: cosineannealinglr
  step_size: 5
  gamma: 0.1
train:
  epochs: 20
  early_stopping_patience: 8
  early_stopping_min_delta: 0.001
  cv_folds: 5
  use_cross_validation: false
